    // 영상 추가: 1개 제한 + 길이·용량 검사를 통과한 것만 목록에 넣는다
    function addVideoFile(file) {
      if (selectedPhotos.some(p => p.type === 'video')) {
        alert('영상은 후기당 1개만 올릴 수 있어요.\n(용량 절약을 위해서예요)');
        return;
      }
      if (file.size > VIDEO_MAX_BYTES) {
        const mb = (file.size / 1024 / 1024).toFixed(0);
        alert(`영상이 너무 커요 (${mb}MB).\n${VIDEO_MAX_BYTES / 1024 / 1024}MB 이하 영상만 올릴 수 있어요.`);
        return;
      }
      const preview = URL.createObjectURL(file);
      const probe = document.createElement('video');
      probe.preload = 'metadata';
      probe.onloadedmetadata = () => {
        const dur = probe.duration;
        if (isFinite(dur) && dur > VIDEO_MAX_SEC + 0.5) {
          URL.revokeObjectURL(preview);
          alert(`영상이 너무 길어요 (${Math.round(dur)}초).\n${VIDEO_MAX_SEC}초 이내의 손맛·하이라이트 영상만 올릴 수 있어요.`);
          return;
        }
        selectedPhotos.push({ file, preview, content: '', type: 'video', duration: isFinite(dur) ? dur : null });
        renderPhotoPreview();
        renderPhotoForms();
        scheduleAutosave();
      };
      probe.onerror = () => {
        URL.revokeObjectURL(preview);
        alert('영상을 읽을 수 없어요. 다른 영상으로 시도해 주세요.');
      };
      probe.src = preview;
    }

    // 카톡 대표 이미지(thumb_url) = 후기의 '첫 사진'을 자동 사용 (영상 제외)
    // 사진 업로드가 끝난 뒤 호출해서 trips.thumb_url을 갱신한다.
    async function setCoverFromFirstPhoto(tripId) {
      const { data: ph } = await getSupabase()
        .from('photos')
        .select('url,type,order_index')
        .eq('trip_id', tripId)
        .order('order_index', { ascending: true });
      const firstImg = (ph || []).find(p => (p.type || 'image') === 'image');
      await getSupabase().from('trips')
        .update({ thumb_url: firstImg ? firstImg.url : null })
        .eq('id', tripId);
    }

    function renderPhotoPreview() {
      const html = selectedPhotos.map((item, index) => {
        if (item.type === 'video') {
          const sec = item.duration ? `${Math.round(item.duration)}초` : '';
          return `
            <div class="photo-preview-item is-video">
              <video class="pv-video" src="${item.preview}" muted playsinline preload="metadata"></video>
              <span class="pv-play">▶</span>
              ${sec ? `<span class="pv-dur">🎬 ${sec}</span>` : ''}
              <span class="photo-num-badge">${index + 1}</span>
              <button class="photo-remove-btn" onclick="removePhoto(${index})" aria-label="사진 삭제">✕</button>
            </div>
          `;
        }
        return `
          <div class="photo-preview-item">
            <img src="${item.preview}" alt="선택된 사진 ${index + 1}" loading="lazy" decoding="async" draggable="false">
            <span class="photo-num-badge">${index + 1}</span>
            <button class="photo-remove-btn" onclick="removePhoto(${index})" aria-label="사진 삭제">✕</button>
          </div>
        `;
      }).join('');
      document.getElementById('photoPreviewGrid').innerHTML = html;
    }

    function removePhoto(index) {
      const removed = selectedPhotos[index];
      if (removed && removed.id) removedPhotoIds.push(removed.id);
      selectedPhotos.splice(index, 1);
      renderPhotoPreview();
      renderPhotoForms();
      scheduleAutosave();
    }

    // 사진 미리보기 그리드 드래그 정렬 (끼워넣기 방식)
    let photoSortable = null;
    function initPhotoSortable() {
      if (photoSortable || !window.Sortable) return;
      const grid = document.getElementById('photoPreviewGrid');
      // 길게누르기(열기/링크복사 등) OS 메뉴 차단
      grid.addEventListener('contextmenu', (e) => e.preventDefault());
      photoSortable = Sortable.create(grid, {
        animation: 150,
        forceFallback: true,   // OS 기본 동작 대신 자체 드래그 → 콜아웃 메뉴 방지
        fallbackTolerance: 3,  // 살짝만 움직여도 드래그 시작
        delay: 150,             // 터치 시 150ms 눌러야 드래그 시작 → 짧은 스와이프는 스크롤로 통과
        delayOnTouchOnly: true, // 마우스는 그대로 즉시 드래그, 터치에서만 delay 적용
        touchStartThreshold: 5, // delay 대기 중 5px 넘게 움직이면 스크롤로 간주해 드래그 취소
        filter: '.photo-remove-btn', // ✕ 버튼은 드래그 안 됨
        // 🚨 아이폰에서 삭제가 안 되던 원인. 기본값(true)이면 filter에 걸린 요소의
        // touchstart를 preventDefault 해버리는데, iOS는 그러면 click 자체를 안 만든다.
        preventOnFilter: false,
        onEnd: (evt) => {
          if (evt.oldIndex === evt.newIndex) return;
          // 끌어온 사진을 새 위치에 끼워넣고 나머지는 밀어냄
          const [moved] = selectedPhotos.splice(evt.oldIndex, 1);
          selectedPhotos.splice(evt.newIndex, 0, moved);
          renderPhotoPreview();
          renderPhotoForms();
          scheduleAutosave();
        }
      });
    }

    function renderPhotoForms() {
      const html = selectedPhotos.map((item, index) => {
        const isVideo = item.type === 'video';
        const thumb = isVideo
          ? `<video src="${item.preview}" muted playsinline preload="metadata"></video>`
          : `<img src="${item.preview}" alt="사진 ${index + 1}" loading="lazy" decoding="async">`;
        const badge = isVideo
          ? `<span class="pf-badge">🎬 ${index + 1}</span>`
          : `<span class="pf-badge">${index + 1}</span>`;
        const ph = isVideo ? '이 영상에 대한 설명을 적어주세요...' : '이 사진에 대한 후기를 적어주세요...';
        return `
        <div class="form-section">
          <div class="photo-form-group">
            <div class="photo-form-group-header">
              <div class="photo-form-group-image">
                ${thumb}
                ${badge}
              </div>
            </div>
            <div class="mic-wrap">
              <textarea
                class="form-input"
                placeholder="${ph}"
                rows="3"
                onchange="selectedPhotos[${index}].content = this.value; scheduleAutosave()"
              >${item.content || ''}</textarea>
              <button type="button" class="mic-fab" onclick="toggleMic(this)" aria-label="음성으로 입력">${MIC_SVG}</button>
            </div>
          </div>
        </div>
      `;
      }).join('');
      document.getElementById('photoFormsContainer').innerHTML = html;
    }

    // 저장 중 로딩 오버레이 표시/숨김
    function showLoading(message = '저장 중...') {
      document.querySelector('#loadingOverlay .loading-text').textContent = message;
      document.getElementById('loadingOverlay').classList.add('active');
    }
    function hideLoading() {
      document.getElementById('loadingOverlay').classList.remove('active');
    }

    // 편집화면에서는 사진 썸네일 줄 한가운데에 띄운다 —
    // 화면 정중앙은 큰 사진·캡션 위에 걸쳐 어디를 가리키는지 흐릿했다.
    // 사진줄이 비어 있으면(높이 0) 기준으로 쓸 수 없으니 CSS 기본값인 화면 정중앙으로 되돌린다.
    function placeToast(toast) {
      const grid = document.getElementById('photoPreviewGrid');
      const onWrite = document.getElementById('writePage').classList.contains('active');
      if (onWrite && grid && grid.children.length) {
        const r = grid.getBoundingClientRect();
        toast.style.top = (r.top + r.height / 2) + 'px';
        toast.style.left = (r.left + r.width / 2) + 'px';
      } else {
        toast.style.top = '';
        toast.style.left = '';
      }
    }

    // 저장 완료 토스트 (기본 1.5초 — 저장 알림은 3초로 길게 부른다)
    let saveToastTimer = null;
    function showToast(message = '✓ 저장 완료!', duration = 1500) {
      const toast = document.getElementById('saveToast');
      placeToast(toast);
      toast.textContent = message;
      toast.classList.add('active');
      clearTimeout(saveToastTimer);
      saveToastTimer = setTimeout(() => toast.classList.remove('active'), duration);
    }

    // 후기 저장 (신규 생성/기존 수정 공통) — editingTripId 유무로 갈리고,
    // 한 번 생성되면 editingTripId가 이어져서 다음 자동저장부터는 계속 업데이트만 함.
    async function persistTrip() {
      // 권한이 없으면 아예 시도하지 않는다 — 안 그러면 자동저장이 2초마다 무한 재시도한다.
      if (!currentUser || isBlocked()) return false;

      const caption = document.getElementById('captionInput').value.trim();
      if (!caption && selectedPhotos.length === 0) return false;

      if (editingTripId) {
        const { error: updateError } = await getSupabase()
          .from('trips')
          .update({ caption })
          .eq('id', editingTripId);
        if (updateError) throw updateError;
      } else {
        const { data: tripData, error: tripError } = await getSupabase()
          .from('trips')
          .insert({ caption, author_id: currentUser.id })
          .select();
        if (tripError) throw tripError;
        editingTripId = tripData[0].id;
      }

      const tripId = editingTripId;

      // 새 파일은 업로드 후 file/id를 갱신해 다음 자동저장에서 중복 업로드되지 않게 함
      await Promise.all(selectedPhotos.map(async (item, i) => {
        if (item.file) {
          const isVideo = item.type === 'video';
          const uploadFile = isVideo ? item.file : await compressImage(item.file);
          // Storage 키에 한글/특수문자 불가 → 확장자만 보존한 안전한 파일명 사용
          const ext = (uploadFile.name.match(/\.[^.]+$/) || ['.jpg'])[0].toLowerCase();
          const fileName = `${Date.now()}_${i}${ext}`;
          const { error: uploadError } = await getSupabase().storage
            .from('trip-photos')
            .upload(`${tripId}/${fileName}`, uploadFile, isVideo ? { contentType: item.file.type } : undefined);
          if (uploadError) throw uploadError;

          const { data: { publicUrl } } = getSupabase().storage
            .from('trip-photos')
            .getPublicUrl(`${tripId}/${fileName}`);

          const { data: insertedPhoto, error: insertError } = await getSupabase()
            .from('photos')
            .insert({
              trip_id: tripId,
              url: publicUrl,
              content: item.content || '',
              order_index: i,
              type: item.type || 'image'
            })
            .select()
            .single();
          if (insertError) throw insertError;

          item.file = null;
          item.id = insertedPhoto.id;
          item.preview = publicUrl;
        } else if (item.id) {
          // 이미 업로드된 사진/영상은 순서·글만 갱신
          await getSupabase()
            .from('photos')
            .update({ content: item.content || '', order_index: i })
            .eq('id', item.id);
        }
      }));

      // 화면에서 지운 사진을 실제로 삭제 — Storage 파일은 절대 건드리지 않는다.
      // (기본 후기 복사본들이 같은 Storage 파일 URL을 공유하고 있어서 파일까지 지우면
      //  다른 회원의 기본 후기 사진까지 깨진다)
      if (removedPhotoIds.length) {
        await getSupabase().from('photos').delete().in('id', removedPhotoIds);
        removedPhotoIds = [];
      }

      // 카톡 대표 이미지 = 첫 사진 자동 지정
      await setCoverFromFirstPhoto(tripId);
      return true;
    }

    // ===== 자동저장 =====
    // 조작 2초 후 조용히 저장. 화면을 덮는 로딩 없이 헤더의 작은 아이콘 상태로만 표시.
    // 상태: idle(아직 저장할 내용 없음) · saving(저장 중, 회전) · saved(초록) · error(빨강)
    // 저장이 끝난 순간에만 "자동 저장됐어요"가 잠깐 떴다 사라진다 — 투명도 차이만으로는
    // 폰에서 저장 여부를 알 수 없어 "저장됐나?" 하는 불안이 남았다.
    let autosaveTimer = null;
    let autosaveInFlight = false;
    let autosavePending = false;

    // 버튼에 쓰이는 글자가 곧 상태 표시다 — 따로 알림을 띄우지 않는다
    const AUTOSAVE_LABELS = { idle: '저장하기', saving: '저장 중…', saved: '저장 완료', error: '저장 실패' };

    function setSaveStatus(state) {
      const btn = document.getElementById('autosaveBtn');
      if (!btn) return;
      btn.classList.remove('idle', 'saving', 'saved', 'error');
      btn.classList.add(state);
      btn.textContent = AUTOSAVE_LABELS[state] || '저장하기';
    }

    function resetAutosaveState(initialState) {
      clearTimeout(autosaveTimer);
      autosaveInFlight = false;
      autosavePending = false;
      setSaveStatus(initialState);
    }

    function scheduleAutosave() {
      // 방금 뭔가 고쳤다는 뜻이므로 '저장완료'를 거둔다 —
      // 안 그러면 저장 안 된 변경을 두고 버튼이 "저장완료"라고 거짓말을 한다
      setSaveStatus('idle');
      clearTimeout(autosaveTimer);
      autosaveTimer = setTimeout(runAutosave, 2000);
    }

    async function runAutosave() {
      // 구경 모드는 절대 저장하지 않는다. 입력이 막혀 있어 여기까지 올 일이 없지만,
      // RLS 거부가 200 + 0행으로 와서 "저장됨"으로 오해될 수 있으니 한 겹 더 막는다.
      if (document.body.classList.contains('write-demo')) return;
      if (autosaveInFlight) { autosavePending = true; return; }
      autosaveInFlight = true;
      setSaveStatus('saving');
      try {
        const saved = await persistTrip();
        if (saved) {
          await loadTrips();
          renderFeed();
          setSaveStatus('saved');   // 자동저장은 여기까지 — 큰 알림은 눌렀을 때만
        } else {
          // 저장할 내용이 없거나 권한이 없는 경우 — 'saving' 회전 상태로 굳지 않게 되돌린다
          setSaveStatus('idle');
        }
      } catch (error) {
        console.error('자동저장 실패:', error);
        setSaveStatus('error');
        autosavePending = true;
      } finally {
        autosaveInFlight = false;
        if (autosavePending) {
          autosavePending = false;
          scheduleAutosave();
        }
      }
    }

    // 대기 중인 저장을 즉시 실행(네비게이션을 막지 않도록 완료를 기다리지 않음)
    function flushAutosave() {
      clearTimeout(autosaveTimer);
      runAutosave();
    }

    function exitWritePage() {
      flushAutosave();
      goToHome();
    }

    // 저장하기 버튼 — 저장만 하고 편집화면에 그대로 머문다.
    // 나가는 건 좌스와이프(exitWritePage)가 맡는다. 그쪽도 flushAutosave 를 하므로 안전하다.
    async function saveNow() {
      clearTimeout(autosaveTimer);
      await runAutosave();
      const btn = document.getElementById('autosaveBtn');
      if (!btn) return;
      // 눌러서 저장했을 때만 크게 알린다 (자동저장은 라벨만 조용히 바뀐다).
      // 3초 — 저장됐다는 확신이 남을 만큼 머무른다.
      if (btn.classList.contains('saved')) {
        showToast('✓ 저장 완료!', 3000);
      } else if (btn.classList.contains('idle')) {
        // 제목도 사진도 없으면 persistTrip 이 false 를 주고 idle 로 돌아온다.
        // 여기서 말해주지 않으면 "눌렀는데 아무 일도 안 일어난다"가 된다.
        showToast('사진이나 제목을 먼저 넣어주세요', 3000);
      }
    }

    // 미리보기를 떠날 때 몇 번째 사진을 보고 있었는지 기억해둔다(스와이프로 나갈 때만 —
    // 카드를 탭해서 새로 여는 경우까지 여기 걸리면 안 되니 previewPage 스와이프 핸들러 전용).
    // 슬라이드 높이 = 컨테이너 높이(scroll-snap)라, 스크롤 위치를 높이로 나누면 사진 번호가 된다.
    function rememberPhotoPos() {
      const body = document.getElementById('detailBody');
      if (!body || !body.clientHeight) return;
      lastViewedPhotoIndex = Math.round(body.scrollTop / body.clientHeight);
    }

    // 편집 → 미리보기 스와이프: 저장된 후기가 있을 때만 이동(신규 글은 아직 갈 곳이 없음)
    function goToPreviewFromWrite() {
      // 구경 모드엔 저장 대상(editingTripId)이 없다. 그래도 보던 후기로 되돌아갈 수는 있어야 한다 —
      // 배너가 "좌우로 밀어 더 구경하셔도 돼요"라고 안내하는데 한쪽만 되면 그 말이 거짓이 된다.
      if (!editingTripId) {
        const trip = trips[currentTripIndex];
        if (trip) viewTrip(trip.id, 'preview', true);
        return;
      }
      flushAutosave();
      viewTrip(editingTripId, 'preview', true);
    }

    // 메인 피드에 실제로 보이는 후기들 — renderFeed()와 같은 기준이어야 한다.
    // ⚠️ _external = 카톡 링크로 열어본 남의 후기. 화면에 띄우려고 배열에만 담아둔 것이라
    //    피드에는 안 나온다. 이걸 안 거르면 메인에서 좌우로 밀었을 때 목록에 없는 남의 후기가
    //    열린다(실제로 그랬다 — 링크로 후기를 보고 4/4로 앱에 들어온 직후).
    function feedTrips() {
      return trips.filter(t => !t._external);
    }

    // 메인 → 미리보기 스와이프: 보던 후기로, 보던 사진까지 이어서 돌아간다.
    // 처음 들어왔거나 그 후기가 사라졌으면 가장 최근 후기를 첫 장부터 연다.
    function resumePreview() {
      const mine = feedTrips();
      if (!mine.length) return;
      const latest = [...mine].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))[0];
      const target = mine.find(t => t.id === lastViewedTripId) || latest;
      viewTrip(target.id, 'preview', true);
    }

    // 메인 → 편집 스와이프: 새 글이 아니라 보던 후기를 바로 수정 — 미리보기→편집과 의미를 통일.
    // 고칠 수 있는 게 있으면 "내 후기" 중에서 고르고, 없으면(비회원·차단·내 후기 0) 보던 후기를
    // 그냥 연다 — 편집 여부는 goToEditTrip()이 canEditTrip()으로 판정해 구경 모드로 띄운다.
    // ⚠️ 여기서 막으면 안 된다. 미리보기→좌스와이프는 구경 모드로 열리는데 메인→우스와이프만
    //    무반응이면 같은 화면으로 가는 두 길 중 하나만 끊겨 순환이 깨진다.
    function resumeEditTrip() {
      const feed = feedTrips();
      if (!feed.length) return;
      const byNewest = (a, b) => new Date(b.createdAt) - new Date(a.createdAt);
      const mine = (currentUser && !isBlocked()) ? feed.filter(isMine).sort(byNewest) : [];
      const target = mine.find(t => t.id === lastViewedTripId) || mine[0]
        || feed.find(t => t.id === lastViewedTripId) || [...feed].sort(byNewest)[0];
      currentTripIndex = trips.findIndex(t => t.id === target.id);
      goToEditTrip();
    }

    // 좌우 스와이프로도 페이지 이동 — 버튼과 동일한 기존 함수를 그대로 호출(시각적 캐러셀 없이 제스처만 추가)
    function initSwipeNav(pageEl, { onSwipeLeft, onSwipeRight } = {}) {
      if (!pageEl) return;
      let startX = 0, startY = 0, startT = 0, tracking = false;
      pageEl.addEventListener('touchstart', e => {
        const t = e.touches[0];
        startX = t.clientX; startY = t.clientY; startT = Date.now(); tracking = true;
      }, { passive: true });
      pageEl.addEventListener('touchend', e => {
        if (!tracking) return;
        tracking = false;
        const t = e.changedTouches[0];
        const dx = t.clientX - startX, dy = t.clientY - startY;
        const dt = Date.now() - startT;
        if (dt > 300) return; // 빠른 플릭만 인정 — 사진 그리드의 눌러서-끄는 정렬 동작과 구분
        if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return; // 최소 60px + 수평 우세
        (dx < 0 ? onSwipeLeft : onSwipeRight)?.();
      }, { passive: true });
    }

    function copyURL() {
      navigator.clipboard.writeText(location.href).then(() => {
        alert('링크가 복사되었습니다!');
      }).catch(() => {
        alert('복사 실패');
      });
    }

    // 문자열 길이 기반 짧은 해시 (대표사진이 바뀌면 값이 달라짐 → 카톡 캐시 갱신용)
    function shortHash(s) {
      let h = 0;
      for (let i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) | 0; }
      return Math.abs(h).toString(36);
    }

    // 클립보드 복사 (https 아닌 환경에서도 동작하는 폴백 포함)
    async function copyText(text) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch (_e) { /* 폴백으로 진행 */ }
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
      } catch (_e) {
        return false;
      }
    }

    async function shareLink() {
      const trip = trips[currentTripIndex];

      // 앱 후기 상세로 바로 들어가는 링크 (카톡의 버튼/본문 클릭 시 이동)
      // ?view= 로 진입하면 자동으로 읽기 전용 후기페이지가 열린다 (mode 파라미터 불필요)
      // 🚨 링크에 싣는 값은 id 가 아니라 share_token 이다. id 는 알아내면 열리는 이름표라
      //    링크를 안 받은 사람도 볼 수 있었다 → 009_share_token.sql
      const appUrl = 'https://ra-review.com/?view=' + trip.share_token;
      // 밴드/일반 링크 붙여넣기용(OG 미리보기) — 카톡 SDK 미사용 시 폴백
      const ogUrl = 'https://rabong-og.kmeimei2017.workers.dev/?id=' + trip.share_token + '&v=' + shortHash(trip.thumb_url || trip.id);

      // 카드 내용 (지금 데이터로 자동 구성)
      const firstImage = (trip.photos || []).find(p => (p.type || 'image') === 'image');
      const firstNote = (trip.photos || []).find(p => p.content && p.content.trim());
      const title = trip.caption || 'Ra-Review';
      const description = (firstNote ? firstNote.content : '').trim().slice(0, 100) || '후기를 공유합니다 🎣';
      const imageUrl = trip.thumb_url
        || (firstImage && firstImage.url)
        || 'https://ra-review.com/og-image.jpg';

      // ① 카카오 SDK 준비됨 → 카톡 공유 카드(원터치, 큰 카드 + 버튼)
      if (isKakaoReady()) {
        try {
          Kakao.Share.sendDefault({
            objectType: 'feed',
            content: {
              title,
              description,
              imageUrl,
              link: { mobileWebUrl: appUrl, webUrl: appUrl },
            },
            buttons: [
              { title: '후기 보러가기', link: { mobileWebUrl: appUrl, webUrl: appUrl } },
            ],
          });
          return;
        } catch (e) {
          console.log('카카오 공유 실패 → 링크 복사로 대체', e);
        }
      }

      // ② 폴백: 링크 복사 (키 발급 전/밴드/PC 등). OG로 미리보기 카드가 뜸
      const ok = await copyText(ogUrl);
      if (ok) {
        alert('친구에게 보낼 링크가 복사되었습니다!\n카톡/밴드에 붙여넣기 하세요.');
      } else {
        prompt('아래 링크를 길게 눌러 복사하세요:', ogUrl);
      }
    }

    // 미리보기 ↔ 편집/메인 좌우 스와이프 (버튼과 동일 동작)
    initSwipeNav(document.getElementById('previewPage'), {
      onSwipeLeft: () => { rememberPhotoPos(); goToEditTrip(); },
      onSwipeRight: () => { rememberPhotoPos(); goToHome(); },
    });
    initSwipeNav(document.getElementById('writePage'), {
      onSwipeLeft: () => exitWritePage(),
      onSwipeRight: () => goToPreviewFromWrite(),
    });
    initSwipeNav(document.getElementById('homePage'), {
      onSwipeLeft: () => resumePreview(),
      onSwipeRight: () => resumeEditTrip(),
    });

    // ===== 홈 화면에 추가 (앱처럼 쓰기) =====
    // 이 앱은 웹앱이지만 홈 화면에 두면 주소창 없이 전체화면으로 열린다.
    // ★ 자동 팝업은 두지 않는다. 홈 화면에 둘지는 몇 번 써보고 "계속 쓰겠다"고
    //   마음먹은 뒤에 정하는 일이라, 먼저 들이미는 건 마찰만 된다.
    //   진입로는 프로필 시트 한 곳뿐이고, 사용자가 찾아왔을 때만 안내한다.
    let a2hsPrompt = null; // 안드로이드 크롬이 주는 설치 프롬프트 보관

    // 이미 홈 화면 앱으로 실행 중인가
    function isStandaloneApp() {
      return window.matchMedia('(display-mode: standalone)').matches
          || window.matchMedia('(display-mode: fullscreen)').matches
          || window.navigator.standalone === true; // iOS
    }

    function isIOSDevice() {
      const ua = navigator.userAgent;
      // iPadOS 13+ 는 데스크톱 사파리로 위장하므로 터치 개수로 가려낸다
      return /iPad|iPhone|iPod/.test(ua)
          || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    }

    // 카톡·밴드·인스타 등 인앱 브라우저 — 여기선 홈 화면 추가가 아예 불가능하다.
    // ★ 이 앱의 주 유입 경로가 카톡 링크라 이 분기가 실제로 제일 많이 걸린다.
    //   빼먹으면 "눌렀는데 아무 일도 안 일어남"이 된다.
    function isInAppBrowser() {
      return /KAKAOTALK|NAVER|Instagram|FBAN|FBAV|FB_IAB|Line\/|DaumApps|; ?wv\)/i.test(navigator.userAgent);
    }

    function isMobileLike() {
      return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || !!a2hsPrompt;
    }

    // 안내를 보여줄 수 있는 상황인가 (프로필 시트 항목 표시 여부와 동일)
    function canOfferA2HS() {
      return !isStandaloneApp() && isMobileLike();
    }

    function refreshA2HSVisibility() {
      document.body.classList.toggle('a2hs-off', !canOfferA2HS());
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();          // 크롬 기본 배너를 막고 우리 타이밍에 띄운다
      a2hsPrompt = e;
      refreshA2HSVisibility();
    });

    window.addEventListener('appinstalled', () => {
      a2hsPrompt = null;
      refreshA2HSVisibility();  // 설치되면 시트 항목이 사라진다
      showToast('홈 화면에 추가됐어요 🎣');
    });

    function onA2HSTap() {
      hideProfileSheet();
      showA2HSCard();
    }

    // 상황별 안내 카드 — 프로필 시트에서 사용자가 직접 눌렀을 때만 열린다.
    function showA2HSCard() {
      const SHARE_SVG = '<svg class="a2hs-ico" viewBox="0 0 24 24"><path d="M12 2 8.5 5.5 9.9 6.9 11 5.8V15h2V5.8l1.1 1.1 1.4-1.4L12 2zM5 10v10c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2h-3v2h3v10H7V10h3V8H7c-1.1 0-2 .9-2 2z"/></svg>';
      const PLUS_SVG  = '<svg class="a2hs-ico" viewBox="0 0 24 24"><path d="M19 11h-6V5h-2v6H5v2h6v6h2v-6h6z"/></svg>';
      const MENU_SVG  = '<svg class="a2hs-ico" viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>';

      const lead = '홈 화면에 추가';
      const sub  = '설치 없이 아이콘만 생겨요.<br>주소창 없이 <b>앱처럼 전체화면</b>으로 열려요.';

      let body, mainLabel, onMain;

      if (isInAppBrowser()) {
        // 카톡 안에서는 불가능 — 밖으로 나가는 길부터 알려준다.
        // 🚨 나가는 방법이 기기마다 다르다. 아이폰 카톡에는 '다른 브라우저로 열기'가
        //    아예 없어서 공유 시트를 거쳐야 하고, 그만큼 단계가 하나 더 늘어난다.
        //    안드로이드 문구를 아이폰에 그대로 보여주면 없는 버튼을 가리키게 된다.
        body = isIOSDevice() ? `
          <div class="a2hs-steps">
            <div class="a2hs-step"><span class="a2hs-num">1</span><span>아래 ${SHARE_SVG} <b>공유</b> 버튼을 누르고</span></div>
            <div class="a2hs-step"><span class="a2hs-num">2</span><span>목록에서 <b>Safari로 열기</b></span></div>
            <div class="a2hs-step"><span class="a2hs-num">3</span><span>Safari에서 다시 ${SHARE_SVG} 를 눌러 ${PLUS_SVG} <b>홈 화면에 추가</b></span></div>
          </div>` : `
          <div class="a2hs-steps">
            <div class="a2hs-step"><span class="a2hs-num">1</span><span>오른쪽 아래 ${MENU_SVG} 를 눌러<br><b>다른 브라우저로 열기</b></span></div>
            <div class="a2hs-step"><span class="a2hs-num">2</span><span>열린 브라우저에서 <b>홈 화면에 추가</b></span></div>
          </div>`;
        mainLabel = '알겠어요';
        onMain = null;
      } else if (a2hsPrompt) {
        // 안드로이드 크롬 — 원터치
        body = '';
        mainLabel = '홈 화면에 추가';
        onMain = async () => {
          const p = a2hsPrompt;
          a2hsPrompt = null;      // 프롬프트는 1회용
          refreshA2HSVisibility();
          try { await p.prompt(); } catch (_e) {}
        };
      } else if (isIOSDevice()) {
        // 아이폰 — 사파리 공유 시트를 거쳐야 한다 (자동 프롬프트가 없다)
        body = `
          <div class="a2hs-steps">
            <div class="a2hs-step"><span class="a2hs-num">1</span><span>아래 ${SHARE_SVG} <b>공유</b> 버튼을 누르고</span></div>
            <div class="a2hs-step"><span class="a2hs-num">2</span><span>${PLUS_SVG} <b>홈 화면에 추가</b>를 고르세요</span></div>
          </div>`;
        mainLabel = '알겠어요';
        onMain = null;
      } else {
        // 안드로이드인데 프롬프트가 아직 없는 경우(삼성 인터넷·파이어폭스 등)
        body = `
          <div class="a2hs-steps">
            <div class="a2hs-step"><span class="a2hs-num">1</span><span>브라우저 ${MENU_SVG} <b>메뉴</b>를 누르고</span></div>
            <div class="a2hs-step"><span class="a2hs-num">2</span><span>${PLUS_SVG} <b>홈 화면에 추가</b>(앱 설치)를 고르세요</span></div>
          </div>`;
        mainLabel = '알겠어요';
        onMain = null;
      }

      const ov = document.createElement('div');
      ov.className = 'mic-onboard-overlay';
      ov.innerHTML = `
        <div class="mic-onboard-card">
          <img class="a2hs-app-ico" src="icon-192.png" alt="">
          <p class="ob-lead">${lead}</p>
          <p class="a2hs-sub">${sub}</p>
          ${body}
          <button type="button" class="ob-btn">${mainLabel}</button>
          <button type="button" class="ob-btn-ghost">닫기</button>
        </div>`;
      document.body.appendChild(ov);

      ov.querySelector('.ob-btn').addEventListener('click', () => {
        ov.remove();
        if (onMain) onMain();
      });
      ov.querySelector('.ob-btn-ghost').addEventListener('click', () => ov.remove());
    }

    // 서비스워커 — 크롬 설치 프롬프트의 전제 조건. 캐시는 오프라인 폴백만 한다.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch((e) => console.log('SW 등록 실패:', e));
      });
    }

    // 편집화면 사진 높이의 기준값(--avail) — 키보드가 올라와도 실제로 보이는 높이.
    // 100vh·100dvh 는 아이폰에서 키보드가 올라와도 줄지 않는다. visualViewport 만 줄어든다.
    function syncAvail() {
      const h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
      document.documentElement.style.setProperty('--avail', h + 'px');
    }
    if (window.visualViewport) window.visualViewport.addEventListener('resize', syncAvail);
    window.addEventListener('resize', syncAvail);
    syncAvail();

    refreshA2HSVisibility();

    // 초기화
    (async () => {
      // 공유 링크 여부를 데이터 로딩 전에 먼저 판단 → 홈 화면 깜빡임 방지
      // ★ ?view= 에 실리는 값은 후기 id 가 아니라 share_token(32자 hex)이다.
      //   id 는 이름표라 알아내면 열리지만, 토큰은 추측할 수 없다 → 009_share_token.sql
      const viewToken = new URLSearchParams(location.search).get('view');
      if (viewToken) {
        document.body.classList.add('view-mode'); // 홈 즉시 숨김
      }

      // 로그인 상태를 먼저 확정한다 — 피드 내용이 "누가 보느냐"에 따라 달라지기 때문.
      // 기다리지 않으면 로그인한 사람에게 기본 후기가 잠깐 보였다가 내 후기로 바뀐다.
      await initAuth();

      await loadTrips();
      renderFeed();

      // 공유 링크로 들어온 경우: 해당 후기만 읽기 전용(후기페이지)으로 표시
      if (viewToken) {
        // 내 후기이거나 기본 후기면 피드에 이미 있다 — 토큰으로 찾는다(추가 조회 불필요)
        let target = trips.find(t => t.share_token === viewToken);
        if (!target) {
          // 남의 후기 링크 — 내 피드에는 없으므로 토큰으로 단건만 가져온다.
          // ★ push(끝에 추가)여야 한다. 홈 좌우 스와이프가 trips[0]을 "내 최신 후기"로
          //   보기 때문에, 앞에 넣으면 남의 후기가 그 자리를 차지한다.
          const shared = await loadTripByToken(viewToken);
          if (shared) {
            shared._external = true;
            trips.push(shared);
            target = shared;
          }
        }
        if (target) {
          // viewTrip 은 계속 id 를 받는다 — 토큰은 링크에만 쓰인다
          viewTrip(target.id, 'review');
        } else {
          // 후기를 못 찾으면 홈으로 복귀 (옛 id 링크도 여기로 떨어진다)
          document.body.classList.remove('view-mode');
          setTimeout(showCamBubbleOnce, 800);
        }
      } else {
        // 홈으로 진입한 경우: 카메라 사용 안내 말풍선 1회
        setTimeout(showCamBubbleOnce, 800);
      }
    })();

  </script>
</body>
</html>
